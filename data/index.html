<!DOCTYPE html>

<title>ESP32 Weather Station</title>

<style> 
body { min-width:310px;
       max-width:800px;

    }

         text-align:center;
    }

<body>
<h2>ESP Weather station</h2>
<div id="chart-temperature"></div>
<div id="chart-humidity"></div>
<div id="chart-pressure"></div>
<script>
const sensors=[
    {
        id:'chart-temperature',
        endpoint:'/temperature',
        title:'Temperature',
        unit:'Temperature (Celsius)'
        color: '#059e8a'
    },
    {
        id:'chart-humidity',
        endpoint:'/humidity',
        title:'humidity',
        unit:'Humidity (%)',
        color:'#18009c'
    }

];
function createChart(sensor){
    return Highcharts.chart(sensor.id ,{
        title: {
            text:sensor.title
        },
        series: [{
            showInLegend:false,
            data:[]
        }],
        plotOptions:{
            line:{
                animation:false,
                dataLabels:{
                    enabled:true
                }
            },
            series:{
                color:sensor.color
            }
        },
        xAxis:{
            type:'datetime',
            dateTimeLabelFormat :{
                second:'%H:%M:%S'
            }
        },
        yAxis:{
            title:{
                text:sensor.unit
            }
        },
        credits: {
            enabled:false
        }
    }),
}
